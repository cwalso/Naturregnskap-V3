name: PR quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  api:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Test
        run: pytest -q

  grunnkart-probe:
    name: Probe Grunnkart download
    if: github.head_ref == 'feature/v3-overview-story'
    runs-on: ubuntu-latest
    steps:
      - name: Probe Geonorge capabilities and Atom feed
        shell: bash
        run: |
          set -euo pipefail
          UUID="28c28e3a-d88f-4a34-8c60-5efe6d56a44d"
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          uuid = "28c28e3a-d88f-4a34-8c60-5efe6d56a44d"
          urls = [
              f"https://nedlasting.geonorge.no/api/v3/capabilities/{uuid}",
              f"https://nedlasting.geonorge.no/api/capabilities/{uuid}",
          ]
          wfs_urls = [
              "https://wms.nibio.no/cgi-bin/grunnkart_arealanalyse?service=WFS&request=GetCapabilities",
              "https://wms.nibio.no/cgi-bin/grunnkart_arealanalyse?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetCapabilities",
          ]
          for wfs_url in wfs_urls:
              print("WFS_PROBE_URL", wfs_url)
              try:
                  with urllib.request.urlopen(wfs_url, timeout=30) as response:
                      body = response.read()
                      print("WFS_STATUS", response.status, "BYTES", len(body))
                      print(body[:12000].decode("utf-8", errors="replace"))
              except Exception as exc:
                  print("WFS_ERROR", repr(exc))

          for url in urls:
              print(f"CAPABILITIES_URL={url}")
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      body = response.read()
                      print("STATUS", response.status, "BYTES", len(body))
                      try:
                          data = json.loads(body)
                          print(json.dumps(data, ensure_ascii=False, indent=2)[:30000])
                      except Exception:
                          print(body[:30000].decode("utf-8", errors="replace"))
                  break
              except Exception as exc:
                  print("ERROR", repr(exc))

          atom = "https://nedlasting.geonorge.no/geonorge/ATOM-feeds/GrunnkartArealanalyse_AtomFeedGML.xml"
          print(f"ATOM_URL={atom}")
          try:
              with urllib.request.urlopen(atom, timeout=30) as response:
                  body = response.read()
                  print("ATOM_STATUS", response.status, "BYTES", len(body))
                  root = ET.fromstring(body)
                  ns = {"a": "http://www.w3.org/2005/Atom"}
                  entries = root.findall(".//a:entry", ns)
                  print("ATOM_ENTRIES", len(entries))
                  trondheim_25832 = None
                  for entry in entries:
                      title = (entry.findtext("a:title", default="", namespaces=ns) or "").strip()
                      entry_id = (entry.findtext("a:id", default="", namespaces=ns) or "").strip()
                      text_blob = (title + " " + entry_id).lower()
                      if "trondheim" in text_blob or "5001" in text_blob:
                          print("TRONDHEIM_ENTRY_TITLE", title)
                          print("TRONDHEIM_ENTRY_ID", entry_id)
                          for link in entry.findall("a:link", ns):
                              print("TRONDHEIM_LINK", link.attrib)
                              if "EPSG:25832" in link.attrib.get("title", ""):
                                  trondheim_25832 = link.attrib.get("href")

                  if trondheim_25832:
                      print("TRONDHEIM_DOWNLOAD", trondheim_25832)
                      request = urllib.request.Request(
                          trondheim_25832,
                          headers={"User-Agent": "Naturregnskap-V3/CI"},
                      )
                      with urllib.request.urlopen(request, timeout=120) as download:
                          payload = download.read()
                          print("TRONDHEIM_DOWNLOAD_STATUS", download.status)
                          print("TRONDHEIM_DOWNLOAD_BYTES", len(payload))
                          print("TRONDHEIM_CONTENT_TYPE", download.headers.get("Content-Type"))
                          print("TRONDHEIM_CONTENT_DISPOSITION", download.headers.get("Content-Disposition"))

                      import io
                      import zipfile
                      if payload[:2] == b"PK":
                          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                              print("TRONDHEIM_ZIP_NAMES", archive.namelist())
                              gml_names = [name for name in archive.namelist() if name.lower().endswith(".gml")]
                              if not gml_names:
                                  raise RuntimeError("No GML in Trondheim archive")
                              sample = archive.read(gml_names[0])
                      else:
                          sample = payload

                      print("TRONDHEIM_GML_BYTES", len(sample))
                      sample_root = ET.fromstring(sample)
                      members = list(sample_root)
                      print("TRONDHEIM_ROOT_TAG", sample_root.tag)
                      print("TRONDHEIM_TOP_CHILD_TAGS", [item.tag for item in members[:5]])
                      feature_members = [
                          item for item in sample_root.iter()
                          if item.tag.endswith("featureMember") or item.tag.endswith("member")
                      ]
                      if feature_members:
                          feature = next(iter(feature_members[0]), None)
                          if feature is not None:
                              props = []
                              for child in list(feature):
                                  text_value = (child.text or "").strip()
                                  props.append((child.tag, text_value[:200], child.attrib))
                              print("TRONDHEIM_FIRST_FEATURE_PROPS", props[:80])

              for kind in ("area", "format", "projection"):
                  url = f"https://nedlasting.geonorge.no/api/codelists/{kind}/{uuid}"
                  print("CODELIST_URL", url)
                  with urllib.request.urlopen(url, timeout=30) as response:
                      body = response.read()
                      print("CODELIST", kind, response.status, len(body))
                      print(body[:20000].decode("utf-8", errors="replace"))
          except Exception as exc:
              print("ATOM_OR_CODELIST_ERROR", repr(exc))
          PY

