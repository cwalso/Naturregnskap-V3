name: Trondheim 5001 source check

on:
  push:
    branches:
      - feature/v3-trondheim-level0-data

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Geonorge delivery for Trondheim 5001
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          UUID = "28c28e3a-d88f-4a34-8c60-5efe6d56a44d"
          BASE = "https://nedlasting.geonorge.no"
          report = {}

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Naturregnskap-V3/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.status, json.loads(r.read().decode("utf-8"))

          status, capabilities = get_json(f"{BASE}/api/capabilities/{UUID}")
          report["capabilitiesStatus"] = status
          report["capabilities"] = capabilities

          status, areas = get_json(f"{BASE}/api/codelists/area/{UUID}")
          report["areasStatus"] = status
          trondheim = next(
              item for item in areas
              if str(item.get("code")) == "5001"
          )
          report["trondheim"] = trondheim

          projection = None
          for candidate in trondheim.get("projections", []):
              if str(candidate.get("code")) == "25832":
                  projection = candidate
                  break
          if projection is None:
              raise RuntimeError("Fant ikke EPSG:25832 for Trondheim 5001")

          formats = projection.get("formats", [])
          if not any((item.get("name") or "").upper() == "GML" for item in formats):
              raise RuntimeError("Fant ikke GML for Trondheim 5001 / EPSG:25832")

          payload = {
              "orderLines": [{
                  "areas": [{
                      "code": str(trondheim["code"]),
                      "type": trondheim["type"],
                      "name": trondheim["name"],
                  }],
                  "formats": [{"name": "GML"}],
                  "metadataUuid": UUID,
                  "projections": [{
                      "code": str(projection["code"]),
                      "name": projection["name"],
                      "codespace": projection["codespace"],
                  }],
              }]
          }

          req = urllib.request.Request(
              f"{BASE}/api/order",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Naturregnskap-V3/1.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = r.read().decode("utf-8", errors="replace")
                  report["orderStatus"] = r.status
                  report["orderResponse"] = body[:10000]
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              report["orderStatus"] = exc.code
              report["orderResponse"] = body[:10000]

          Path("trondheim-source-check.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2)
          )

          print(json.dumps({
              "capabilitiesStatus": report["capabilitiesStatus"],
              "area": {
                  "code": trondheim["code"],
                  "name": trondheim["name"],
                  "type": trondheim["type"],
              },
              "projection": {
                  "code": projection["code"],
                  "name": projection["name"],
              },
              "formats": [item.get("name") for item in formats],
              "orderStatus": report["orderStatus"],
              "orderResponse": report["orderResponse"][:1000],
          }, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trondheim-5001-source-check
          path: trondheim-source-check.json
          retention-days: 3
