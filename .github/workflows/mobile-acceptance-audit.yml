name: B5.2d isolated acceptance audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/tests/browser/review-mobile-acceptance.mjs'
      - '.github/workflows/mobile-acceptance-audit.yml'
permissions:
  contents: read
jobs:
  acceptance:
    if: github.event.pull_request.number == 76
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Audit-only axe dependency
        run: npm install --prefix "$RUNNER_TEMP/b5-axe" --no-save axe-core@4.14.0
      - name: Browser configuration
        run: |
          echo "CHROMIUM_PATH=$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
          echo "UX_AXE_PATH=$RUNNER_TEMP/b5-axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
          echo "AUDIT_SOURCE_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Independent production-build journey and accessibility audit
        env:
          BROWSER_OUTPUT: .browser-results/mobile-acceptance
        run: node tests/browser/review-mobile-acceptance.mjs
      - name: Existing B5.2c mobile regression (unchanged assertions)
        if: always()
        env:
          SPLIT_STAGE: c4
          BROWSER_OUTPUT: .browser-results/mobile-regression
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile,unlink} from 'node:fs/promises'
          const path='tests/browser/.b5-2d-regression-runner.mjs'
          const code=(await readFile('tests/browser/check-mobile-split-view.mjs','utf8')).replace('proxy:{server:process.env.HTTPS_PROXY}', '...(process.env.HTTPS_PROXY?{proxy:{server:process.env.HTTPS_PROXY}}:{})')
          await writeFile(path,code)
          try { await import('./'+path) } finally { await unlink(path) }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b5-2d-acceptance
          path: apps/web/.browser-results/
          retention-days: 14
