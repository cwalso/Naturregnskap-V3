name: Overview screenshot preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Capture actual Overview UI
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({
            viewport: { width: 1600, height: 1100 },
            deviceScaleFactor: 1,
          })

          await page.route('http://127.0.0.1:5173/api/**', async route => {
            const url = new URL(route.request().url())
            const path = url.pathname
            const json = body => route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify(body),
            })

            if (path === '/api/municipalities') {
              return json([{ number: '5001', name: 'Trondheim' }])
            }
            if (path === '/api/municipalities/5001/account-overview') {
              return json({
                municipalityNumber: '5001',
                municipalityName: 'Trondheim',
                period: '2025',
                status: 'available',
                metrics: [
                  { id: 'nature', areaKm2: 380.0, sharePercent: null },
                  { id: 'agriculture', areaKm2: 72.0, sharePercent: null },
                  { id: 'built', areaKm2: 76.6, sharePercent: null },
                ],
                methodVersion: 'level0-v0.3-prototype',
                methodStatus: 'prototype',
                sourceVersions: ['grunnkart-2025'],
                sourceSha256: null,
                sourceFormat: 'preview-fixture',
                sourceFeatureCount: 123456,
                areaMethod: 'preview-only',
                classifiedAreaKm2: 528.6,
                excludedAreaKm2: 0,
                warnings: [
                  'Forhåndsvisning: tallene brukes kun for å kontrollere layout og er ikke regnskapstall for Trondheim.',
                ],
              })
            }
            if (path === '/api/municipalities/5001/boundary') {
              return json({
                type: 'Feature',
                geometry: {
                  type: 'Polygon',
                  coordinates: [[
                    [10.05, 63.15],
                    [10.75, 63.15],
                    [10.75, 63.65],
                    [10.05, 63.65],
                    [10.05, 63.15],
                  ]],
                },
                properties: { number: '5001', name: 'Trondheim' },
              })
            }
            if (path === '/api/municipalities/5001/thematic-coverage') {
              return json({
                municipalityNumber: '5001',
                municipalityName: 'Trondheim',
                methodVersion: 'thematic-intersection-v1',
                warnings: [],
                results: [
                  {
                    datasetId: 'protected-areas',
                    status: 'unavailable',
                    featureCount: null,
                    note: 'Ikke del av denne forhåndsvisningen.',
                  },
                  {
                    datasetId: 'wild-reindeer-areas',
                    status: 'unavailable',
                    featureCount: null,
                    note: 'Ikke del av denne forhåndsvisningen.',
                  },
                ],
              })
            }
            if (path === '/api/municipalities/5001/changes') {
              return json({
                municipalityNumber: '5001',
                municipalityName: 'Trondheim',
                status: 'not_available',
                period: null,
                source: null,
                generationId: null,
                transitions: [],
              })
            }
            return route.fulfill({ status: 404, body: '' })
          })

          await page.goto('http://127.0.0.1:5173/#oversikt', {
            waitUntil: 'domcontentloaded',
            timeout: 15000,
          })
          const input = page.getByRole('combobox', { name: 'Velg kommune' })
          await input.click()
          await page.getByRole('option', { name: 'Trondheim 5001' }).click()
          await page.getByRole('heading', { name: 'Hvor mye natur har Trondheim?' }).waitFor()
          await page.waitForTimeout(2500)

          await page.evaluate(() => {
            const badge = document.createElement('div')
            badge.textContent = 'FORHÅNDSVISNING – DEMOTALL, IKKE REGNSKAPSTALL'
            Object.assign(badge.style, {
              position: 'fixed',
              top: '10px',
              left: '50%',
              transform: 'translateX(-50%)',
              zIndex: '99999',
              padding: '9px 16px',
              background: '#fff3cd',
              color: '#4a3a00',
              border: '1px solid #dfc86b',
              borderRadius: '999px',
              font: '700 13px system-ui, sans-serif',
              boxShadow: '0 2px 8px rgba(0,0,0,.14)',
            })
            document.body.appendChild(badge)
          })

          await page.screenshot({
            path: 'overview-preview.png',
            fullPage: true,
          })
          await browser.close()
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: overview-preview
          path: apps/web/overview-preview.png
          retention-days: 3
