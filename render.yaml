services:
  - type: web
    name: naturregnskap-v3-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NATURREGNSKAP_CORS_ORIGINS
        value: https://cwalso.github.io
